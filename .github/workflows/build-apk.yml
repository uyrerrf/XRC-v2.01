name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        type: choice
        default: 'both'
        options: ['both', 'debug', 'release']

permissions:
  contents: read

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK" "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate wrapper
        working-directory: android
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      # --- Release signing material (only when secrets are set) ---
      - name: Decode release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.XRC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xrc-release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/xrc-release.keystore" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No XRC_KEYSTORE_B64 secret set — release build will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- Debug: always builds, never needs secrets ---
      - name: Build debug APK
        if: inputs.variant != 'release'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace --build-cache

      # --- Release: only when a keystore was decoded ---
      - name: Build release APK
        if: inputs.variant != 'debug' && steps.keystore.outputs.ready == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASS: ${{ secrets.XRC_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.XRC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.XRC_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon --console=plain --stacktrace --build-cache

      - name: Upload debug APK
        if: inputs.variant != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: xrc-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: inputs.variant != 'debug' && steps.keystore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xrc-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
