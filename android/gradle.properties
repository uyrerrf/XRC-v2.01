# ---- XRC · AGP 9.3.0 built-in Kotlin build ----

# Memory / encoding (CI-safe)
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (required — never remove)
android.useAndroidX=true

# AGP 9.0+ ships Kotlin built-in and ENABLES it by default.
# Do NOT add: android.builtInKotlin=false   (temporary opt-out, dead in AGP 10)
# Do NOT add: kotlin version pins, kapt, or kotlin-android plugin entries.
